name: overnight_classic

# 原版八步法：跟 overnight_8step 的盘中扫描同时生成。
# 定时由 overnight_8step 统一触发，避免两套 cron/页面部署互相覆盖。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overnight-classic
  cancel-in-progress: true

jobs:
  classic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_POOL_SIZE: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy psycopg2-binary python-dotenv jinja2

      - name: Build classic intraday candidates
        id: build
        run: |
          NOW=$(TZ=Asia/Shanghai date +%H%M)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ "$NOW" -lt 1430 ] || [ "$NOW" -gt 1505 ]; }; then
            echo "跳过：当前 $NOW，不在 14:30~15:05 时间窗"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          DATE=$(TZ=Asia/Shanghai date +%F)
          python scripts/build_overnight_classic.py --date "$DATE" --live

      - name: Generate funnel page with classic section
        if: steps.build.outputs.run == 'true'
        run: |
          python -m strategies.funnel_strategy.forward_stats || echo "⚠️ forward stats failed, keeping previous JSON"
          python strategies/funnel_strategy/generate_html.py \
            --output ./strategies/funnel_strategy/docs

      - name: Deploy funnel page
        if: steps.build.outputs.run == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./strategies/funnel_strategy/docs
          destination_dir: funnel
          keep_files: true

      - name: Persist classic JSON for later funnel rebuilds
        if: steps.build.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategies/funnel_strategy/docs/overnight_classic.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update classic scan $(TZ=Asia/Shanghai date +%F) [skip ci]"
          git push
