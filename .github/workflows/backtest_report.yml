name: backtest_report

on:
  push:
    branches: [master]
    paths:
      - 'backtest_revenue.py'
      - 'publish_pages.py'
      - '.github/workflows/backtest_report.yml'
  schedule:
    # UTC 09:30 = 北京时间 17:30 (盘后所有策略运行完毕后)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

# Needed so the action can push to the gh-pages branch.
permissions:
  contents: write

# Avoid overlapping daily runs hammering the same DB connection pool.
concurrency:
  group: backtest-report-pages
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_SSLMODE: require
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run backtest
        run: |
          python backtest_revenue.py

      - name: Build Pages payload
        # Injects the "last updated" banner and emits deploy/index.html so the
        # report is served at the site root. Only HTML is published - the large
        # quotes cache stays out of the public artifact.
        run: |
          python publish_pages.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore: 自动更新回测报告"

      - name: Show published URL
        run: |
          echo "报告地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
