name: funnel_strategy

on:
  push:
    branches: [master]
    paths:
      - 'strategies/funnel_strategy/**'
      - 'core/**'
      - '.github/workflows/funnel_strategy.yml'
  schedule:
    - cron: '20 8 * * 1-5'  # UTC 8:20 = 北京时间 16:20 (独立调度，避免与其他 workflow 并发)
  workflow_dispatch:
    inputs:
      date:
        description: '交易日期 (YYYY-MM-DD)，留空=最新'
        required: false
      skip_layers:
        description: '跳过的层级 (逗号分隔, 例如: 0,3)'
        required: false

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_SSLMODE: require
      POSTGRES_POOL_SIZE: 5
      TZ: Asia/Shanghai
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply DB schema migrations
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          pip install psycopg2-binary python-dotenv
          python -m core.db.apply_schema || echo "⚠️ apply_schema 失败，继续执行"

      - name: Check if trading day
        id: check_trading
        run: |
          python3 -c "
          from core.utils.trading_calendar import is_trading_day
          from datetime import datetime, timedelta, timezone, date
          utc_dt = datetime.now(timezone.utc)
          beijing_dt = utc_dt + timedelta(hours=8)
          beijing_date = beijing_dt.date()
          is_trading = is_trading_day(beijing_date)
          print(f'北京时间: {beijing_date} ({\"交易日\" if is_trading else \"休市日\"})')
          with open('/tmp/is_trading.txt', 'w') as f:
              f.write('true' if is_trading else 'false')
          "
          echo "is_trading=$(cat /tmp/is_trading.txt)" >> $GITHUB_OUTPUT

      - name: Skip on non-trading day
        if: steps.check_trading.outputs.is_trading == 'false' && inputs.date == ''
        run: |
          echo "⏭️ 今天不是 A 股交易日，跳过执行"
          exit 0

      - name: Run funnel strategy
        run: |
          CMD="python -m strategies.funnel_strategy.run_funnel --output ./results"
          if [ -n "${{ inputs.date }}" ]; then
            CMD="$CMD --date ${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.skip_layers }}" ]; then
            for layer in $(echo "${{ inputs.skip_layers }}" | tr ',' ' '); do
              CMD="$CMD --disable $layer"
            done
          fi
          echo "Running: $CMD"
          set +e
          $CMD 2>&1 | tee /tmp/funnel_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "strategy_failed=true" >> $GITHUB_ENV
          fi

      - name: Generate HTML report
        run: |
          CMD="python strategies/funnel_strategy/generate_html.py --output ./strategies/funnel_strategy/docs --all-dates"
          if [ -n "${{ inputs.date }}" ]; then
            CMD="python strategies/funnel_strategy/generate_html.py --output ./strategies/funnel_strategy/docs --date ${{ inputs.date }}"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Send Telegram notification
        if: always() && env.EXIT_CODE == '0'
        run: |
          pip install psycopg2-binary python-dotenv
          python .github/scripts/funnel_telegram.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./strategies/funnel_strategy/docs
          destination_dir: funnel
          keep_files: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funnel-results
          path: results/funnel_*.csv
