name: llm_multisource

on:
  push:
    branches: [master]
    paths:
      - 'strategies/llm_multisource/**'
      - '.github/workflows/llm_multisource.yml'
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        required: false
        default: 'afternoon'
        type: choice
        options:
          - afternoon

jobs:
  collect_data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      is_trading: ${{ steps.check_trading.outputs.is_trading }}
    
    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_POOL_SIZE: 5
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TZ: Asia/Shanghai
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r strategies/llm_multisource/requirements.txt

      - name: Check if trading day
        id: check_trading
        run: |
          python3 -c "
          from core.utils.trading_calendar import is_trading_day
          from datetime import datetime, timedelta, timezone
          beijing_date = (datetime.now(timezone.utc) + timedelta(hours=8)).date()
          is_trading = is_trading_day(beijing_date)
          print(f'北京时间: {beijing_date} ({is_trading})')
          with open('/tmp/is_trading.txt','w') as f:
              f.write('true' if is_trading else 'false')
          "
          echo "is_trading=$(cat /tmp/is_trading.txt)" >> $GITHUB_OUTPUT

      - name: Skip on non-trading day
        if: steps.check_trading.outputs.is_trading == 'false' && github.event_name != 'workflow_dispatch'
        run: echo "⏭️ 今天不是 A 股交易日，跳过采集"


      - name: Init DB & sync stock info
        if: ${{ steps.check_trading.outputs.is_trading == 'true' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        run: |
          python -m core.db.apply_schema
          python strategies/llm_multisource/seed_sources.py
          python strategies/llm_multisource/sync_stock_info.py

      - name: Collect market data
        if: ${{ steps.check_trading.outputs.is_trading == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m core.market_data.quotes
          python strategies/llm_multisource/collector.py --once

  recommend:
    needs: collect_data
    if: ${{ needs.collect_data.outputs.is_trading == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      # 数据库（持久化）
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_POOL_SIZE: 5
      # LLM
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TZ: Asia/Shanghai
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine run mode
        id: mode
        run: |
          if [ -n "${{ inputs.run_mode }}" ]; then
            MODE="${{ inputs.run_mode }}"
            echo "使用手动指定模式: $MODE"
          else
            MODE="afternoon"
            echo "盘后模式 (UTC 07:10 = 北京时间 15:10)"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r strategies/llm_multisource/requirements.txt

      - name: Fast path extraction (structured data)
        run: python strategies/llm_multisource/structured_extraction.py

      - name: Extract signals with LLM (news + research only)
        run: python strategies/llm_multisource/extractor.py --once

      - name: Aggregate & report
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python strategies/llm_multisource/aggregate.py
          python -m core.tracker.performance
          python -m core.notify.pusher

      - name: Generate LLM report
        continue-on-error: true
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python strategies/llm_multisource/generate_report.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./strategies/llm_multisource/docs
          keep_files: true

      - name: Generate unified HTML report (funnel page)
        continue-on-error: true
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          pip install jinja2 psycopg2-binary python-dotenv
          python strategies/funnel_strategy/generate_html.py --output ./strategies/funnel_strategy/docs || echo "⚠️ funnel HTML generation failed, continuing..."

      - name: Deploy unified HTML to GitHub Pages (funnel)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./strategies/funnel_strategy/docs
          destination_dir: funnel
          keep_files: true

      - name: Send Telegram daily summary
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          pip install psycopg2-binary python-dotenv requests
          python -m strategies.shared.daily_notify || echo "⚠️ Telegram推送失败，继续"
