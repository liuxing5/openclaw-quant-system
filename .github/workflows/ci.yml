name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static checks
        run: |
          pip install pyyaml
          python tools/pre_deploy_check.py
