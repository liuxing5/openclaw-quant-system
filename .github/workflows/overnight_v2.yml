name: overnight_v2

# 14:30 全市场扫描（北京时间 14:30 = UTC 06:30）
# 八步 v3.1（A/B/C 三档） + 杨永兴原版（全市场主板）都在这个 workflow 里跑，
# 保证 14:40-14:50 买入窗口前拿到候选。
permissions:
  contents: write

on:
  schedule:
    # GitHub cron 有 0~15 分钟延迟；双触发 + 当日幂等，尽量卡在 14:30 前完成扫描
    - cron: '29 6 * * 1-5'
    - cron: '31 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '15:05 后强制补跑（会用盘后数据覆盖 14:30 快照）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy psycopg2-binary python-dotenv requests

      - name: Check trading day
        id: check
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          NOW=$(TZ=Asia/Shanghai date +%H%M)
          FORCE="${{ github.event.inputs.force }}"
          R=$(python -c "import sys; sys.path.insert(0,'.'); from core.utils.trading_calendar import is_trading_day; from datetime import date; print('true' if is_trading_day(date.fromisoformat('$D')) else 'false')")
          echo "date=$D" >> $GITHUB_OUTPUT
          echo "is_trading=$R" >> $GITHUB_OUTPUT
          # 14:30 快照必须在收盘前完成；cron-job.org 在盘后测试时不得用收盘数据覆盖 14:30 快照
          if [ "$NOW" -ge 1505 ] && [ "$FORCE" != "true" ]; then
            echo "⏭️ 北京时间 $NOW 已过 15:05，跳过扫描（如需补跑请传 force=true）"
            echo "allow_scan=false" >> $GITHUB_OUTPUT
          else
            echo "allow_scan=true" >> $GITHUB_OUTPUT
          fi

      - name: Scan full market at 14:30 (8-step v3.1)
        if: steps.check.outputs.is_trading == 'true' && steps.check.outputs.allow_scan == 'true'
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          DATE="${{ steps.check.outputs.date }}"
          FORCE="${{ github.event.inputs.force }}"
          # 幂等必须区分「14:30 盘中快照」与「凌晨补跑」：
          # GitHub cron 经常延迟到次日凌晨才触发，那种快照 trade_date 虽是当天，
          # 但 scan_completed_at 在凌晨，不能挡住真正的 14:30 扫描。
          if [ "$FORCE" != "true" ] && python scripts/is_intraday_snapshot.py --date "$DATE"; then
            echo "already scanned $DATE in intraday window, skip"
            exit 0
          fi
          python strategies/overnight_8step/full_market_1430.py --date "$DATE"
          python scripts/build_overnight_v2_page.py

      - name: Build strict Yang Yongxing classic at 14:30
        if: steps.check.outputs.is_trading == 'true' && steps.check.outputs.allow_scan == 'true'
        continue-on-error: true
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          python scripts/build_overnight_classic.py --date "${{ steps.check.outputs.date }}" --live

      - name: Regenerate funnel.html with 14:30 snapshots
        # 关键：overnight_v2 只写 JSON / overnight_v2.html，用户访问的 funnel.html
        # 由 funnel_strategy.yml（16:20）生成发布。14:30 跑完必须同步刷新，
        # 否则八步 v3.1 与杨永兴严格法要等到 16:20 才出现在页面上。
        if: steps.check.outputs.is_trading == 'true' && steps.check.outputs.allow_scan == 'true'
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
          TZ: Asia/Shanghai
        run: |
          DATE="${{ steps.check.outputs.date }}"
          python strategies/funnel_strategy/generate_html.py \
            --output ./strategies/funnel_strategy/docs --date "$DATE"

      - name: Persist v3.1 + classic snapshot
        if: steps.check.outputs.is_trading == 'true' && steps.check.outputs.allow_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/overnight_v2/latest_1430.json \
            strategies/funnel_strategy/docs/overnight_v2.html \
            strategies/funnel_strategy/docs/overnight_classic.json \
            strategies/funnel_strategy/docs/funnel.html \
            strategies/funnel_strategy/docs/funnel-${{ steps.check.outputs.date }}.html
          git diff --cached --quiet && exit 0
          git commit -m "data: update 14:30 v3.1 + classic scan ${{ steps.check.outputs.date }} [skip ci]"
          # 两个 workflow 都会写 overnight_classic.json；rebase 时以本轮新扫描为准，
          # 否则冲突会中断回写（之前被 continue-on-error 吞掉，页面就停在旧数据）。
          git pull --rebase --autostash -X ours
          git push

      - name: Publish funnel page to GitHub Pages
        if: steps.check.outputs.is_trading == 'true' && steps.check.outputs.allow_scan == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./strategies/funnel_strategy/docs
          destination_dir: funnel
          keep_files: true
