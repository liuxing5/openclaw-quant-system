name: overnight_v2

# 14:30 扫描（北京时间 14:30 = UTC 06:30）
on:
  schedule:
    # GitHub cron 有 0~15 分钟延迟；双触发 + 当日幂等，尽量卡在 14:30 前完成扫描
    - cron: '29 6 * * 1-5'
    - cron: '31 6 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy psycopg2-binary python-dotenv requests

      - name: Check trading day
        id: check
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          R=$(python -c "import sys; sys.path.insert(0,'.'); from core.utils.trading_calendar import is_trading_day; from datetime import date; print('true' if is_trading_day(date.fromisoformat('$D')) else 'false')")
          echo "date=$D" >> $GITHUB_OUTPUT
          echo "is_trading=$R" >> $GITHUB_OUTPUT

      - name: Scan at 14:30
        if: steps.check.outputs.is_trading == 'true'
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
          POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
          POSTGRES_POOL_SIZE: 5
        run: |
          DATE="${{ steps.check.outputs.date }}"
          if [ -f docs/overnight_v2/latest.json ] && grep -q "\"trade_date\": \"$DATE\"" docs/overnight_v2/latest.json; then
            echo "already scanned $DATE, skip"
            exit 0
          fi
          python strategies/overnight_8step/v2_intraday.py --date "$DATE"
          python scripts/build_overnight_v2_page.py

      - name: Persist v2 snapshot
        if: steps.check.outputs.is_trading == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/overnight_v2/latest.json strategies/funnel_strategy/docs/overnight_v2.html
          git diff --cached --quiet && exit 0
          git commit -m "data: update overnight v2 scan ${{ steps.check.outputs.date }} [skip ci]"
          git pull --rebase --autostash
          git push
