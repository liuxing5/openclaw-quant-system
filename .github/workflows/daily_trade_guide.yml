name: daily_trade_guide

on:
  push:
    branches: [master]
    paths:
      - 'daily_trade_guide.py'
      - '.github/workflows/daily_trade_guide.yml'
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate_guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_PORT }}
      POSTGRES_USER: ${{ secrets.SUPABASE_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB }}
      POSTGRES_SSLMODE: require
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary python-dotenv

      - name: Run trade guide generator
        run: |
          python daily_trade_guide.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./backtest
          destination_dir: backtest
          keep_files: true